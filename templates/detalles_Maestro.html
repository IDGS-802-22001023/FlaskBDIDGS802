{% extends "layout.html" %}
{% block container %}

<div class="max-w-md mx-auto mt-6 p-6 border rounded-lg shadow bg-gray-100">

    <h2 class="text-2xl font-bold mb-6 text-center">
        Detalles del Maestro
    </h2>

    <div class="relative overflow-x-auto">
        <table class="w-full text-sm text-left text-gray-700 border border-gray-300">
            <tbody>
                <tr class="border-b">
                    <th class="px-4 py-3 bg-gray-200 w-1/3">Matrícula</th>
                    <td class="px-4 py-3">{{ maestro.matricula }}</td>
                </tr>
                <tr class="border-b">
                    <th class="px-4 py-3 bg-gray-200">Nombre</th>
                    <td class="px-4 py-3">{{ maestro.nombre }}</td>
                </tr>
                <tr class="border-b">
                    <th class="px-4 py-3 bg-gray-200">Apellidos</th>
                    <td class="px-4 py-3">{{ maestro.apellidos }}</td>
                </tr>
                <tr class="border-b">
                    <th class="px-4 py-3 bg-gray-200">Especialidad</th>
                    <td class="px-4 py-3">{{ maestro.especialidad }}</td>
                </tr>
                <tr class="border-b">
                    <th class="px-4 py-3 bg-gray-200">Email</th>
                    <td class="px-4 py-3">{{ maestro.email }}</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="flex justify-center mt-6">
        <a href="{{ url_for('maestros.listar_maestros') }}"
           class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg shadow">
            Volver
        </a>
    </div>

</div>

{% endblock %}
