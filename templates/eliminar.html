{% extends "layout.html" %}

{% block container %}
<div class="max-w-md mx-auto mt-6 p-6 bg-white border border-gray-200 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-blue-600 mb-6 text-center">
        Eliminar Alumno
    </h2>

    <form method="post">
        {{ form.hidden_tag() }}

        {{ form.id }}

        <p><b>ID:</b> {{ form.id.data }}</p>
        <p><b>Nombre:</b> {{ form.nombre.data }} {{ form.apellidos.data }}</p>
        <p><b>Email:</b> {{ form.email.data }}</p>
        <p><b>Teléfono:</b> {{ form.telefono.data }}</p>

        <div class="flex justify-center gap-4 mt-6">
            <button type="submit" class="bg-red-200 hover:bg-red-300 text-red-800 px-5 py-2 rounded-lg shadow"
                onclick="return confirm('¿Estás seguro que deseas eliminar este alumno?');">
                Confirmar Eliminación
            </button>

            <a href="{{ url_for('alumnos.listar_alumnos') }}"
                class="bg-blue-200 hover:bg-blue-300 text-blue-800 px-5 py-2 rounded-lg shadow">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
