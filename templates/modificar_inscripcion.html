{% extends "layout.html" %}

{% block container %}

<div class="max-w-md mx-auto mt-6 p-6 bg-white border border-gray-200 rounded-2xl shadow-lg">

    <h2 class="text-2xl font-bold text-blue-600 mb-6 text-center">
        Modificar Inscripción
    </h2>

    <form method="post">
        {{ form.hidden_tag() }}

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2" for="alumno_id">Alumno</label>
            {{ form.alumno_id(class="w-full border border-gray-300 rounded px-3 py-2") }}
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2" for="curso_id">Curso</label>
            {{ form.curso_id(class="w-full border border-gray-300 rounded px-3 py-2") }}
        </div>

        <div class="flex justify-between mt-6">
            <button type="submit" 
                    class="bg-green-200 hover:bg-green-300 text-green-800 px-5 py-2 rounded-lg shadow">
                Actualizar
            </button>
            <a href="{{ url_for('inscripciones.listar_inscripciones') }}" 
               class="bg-red-200 hover:bg-red-300 text-red-800 px-5 py-2 rounded-lg shadow">
                Cancelar
            </a>
        </div>
    </form>

</div>

{% endblock %}
