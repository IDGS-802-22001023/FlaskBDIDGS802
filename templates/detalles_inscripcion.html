{% extends "layout.html" %}

{% block container %}

<div class="max-w-md mx-auto mt-6 p-6 border rounded-lg shadow bg-gray-100 mt-5">

    <h2 class="text-2xl font-bold mb-6 text-center">
        Detalles de la Inscripción
    </h2>

    <div class="relative overflow-x-auto">
        <table class="w-full text-sm text-left text-gray-700 border border-gray-300">

            <tbody>

                <tr class="border-b">
                    <th class="px-4 py-3 bg-gray-200 w-1/3">Alumno</th>
                    <td class="px-4 py-3">
                        {{ alumno.nombre }} {{ alumno.apellidos }}
                    </td>
                </tr>

                <tr class="border-b">
                    <th class="px-4 py-3 bg-gray-200">Curso</th>
                    <td class="px-4 py-3">
                        {{ curso.nombre }}
                    </td>
                </tr>

                <tr class="border-b">
                    <th class="px-4 py-3 bg-gray-200">Profesor</th>
                    <td class="px-4 py-3">
                        {{ curso.maestro.nombre }} {{ curso.maestro.apellidos }}
                    </td>
                </tr>

                <tr>
                    <th class="px-4 py-3 bg-gray-200">Fecha de Inscripción</th>
                    <td class="px-4 py-3">
                        {{ inscripcion.fecha_inscripcion }}
                    </td>
                </tr>

            </tbody>

        </table>
    </div>

    <div class="flex justify-center mt-6">
        <a href="{{ url_for('inscripciones.listar_inscripciones') }}"
            class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg shadow">
            Volver
        </a>
    </div>

</div>

{% endblock %}
