{% extends "layout.html" %}

{% block container %}

<div class="max-w-md mx-auto mt-6 p-6 bg-white border border-gray-200 rounded-2xl shadow-lg">

    <h2 class="text-2xl font-bold text-blue-600 mb-6 text-center mt">
        Eliminar Inscripción
    </h2>

    <form method="post" class="space-y-4">
        {{form.csrf_token}}
        <p><b>Alumno:</b> {{ inscripcion.alumno.nombre }} {{ inscripcion.alumno.apellidos }}</p>
        <p><b>Curso:</b> {{ inscripcion.curso.nombre }}</p>
        <p><b>Fecha de Inscripción:</b> {{ inscripcion.fecha_inscripcion }}</p>

        <div class="flex justify-between mt-6">
            <button type="submit" 
                    class="bg-red-200 hover:bg-red-300 text-red-800 px-5 py-2 rounded-lg shadow">
                Confirmar Eliminación
            </button>
            <a href="{{ url_for('inscripciones.listar_inscripciones') }}" 
               class="bg-blue-200 hover:bg-blue-300 text-blue-800 px-5 py-2 rounded-lg shadow">
                Cancelar
            </a>
        </div>
    </form>

</div>

{% endblock %}
